<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sistema RH PRO</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#f4f6f8}
#app{position:fixed;inset:0;border:0;width:100%;height:100%;background:#f4f6f8}
#login{position:fixed;inset:0;background:#f4f6f8;display:flex;align-items:center;justify-content:center;z-index:10;padding:20px}
.box{width:min(430px,100%);background:#fff;border-radius:18px;padding:28px;box-shadow:0 8px 35px rgba(0,0,0,.12)}
h1{margin:0 0 6px;color:#123b67;font-size:27px}.sub{color:#6b7280;margin-bottom:22px}
label{display:block;font-size:13px;font-weight:700;color:#374151;margin:12px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d4dae1;border-radius:8px;font-size:15px}
button{border:0;border-radius:8px;padding:12px 16px;font-weight:700;cursor:pointer}.primary{background:#123b67;color:#fff;width:100%;margin-top:16px}.secondary{background:#e9eef4;color:#123b67;width:100%;margin-top:9px}
#status{min-height:20px;margin-top:14px;font-size:13px;color:#6b7280;line-height:1.4}.ok{color:#147a4b!important}.err{color:#b42318!important}
.sync{position:fixed;right:14px;bottom:14px;z-index:5;background:#fff;border-radius:999px;padding:8px 12px;box-shadow:0 2px 12px rgba(0,0,0,.12);font-size:12px;color:#123b67;display:none}
.small{font-size:11px;color:#6b7280;margin-top:16px;line-height:1.4}
</style>
</head>
<body>
<div id="login">
  <div class="box">
    <h1>SISTEMA RH PRO</h1>
    <div class="sub">Acesso seguro e sincronização online</div>
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="email" placeholder="seu e-mail">
    <label for="password">Senha</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="mínimo de 6 caracteres">
    <button id="enter" class="primary">Entrar no Sistema</button>
    <button id="signup" class="secondary">Criar meu acesso</button>
    <div id="status"></div>
    <div class="small">Use o mesmo e-mail e senha no computador e no tablet. Os dados do RH PRO serão sincronizados pela internet.</div>
  </div>
</div>
<iframe id="app" title="Sistema RH PRO" src="RH_PRO_FINAL_2026%20%281%29%281%29.html"></iframe>
<div id="sync" class="sync">☁ Sincronização online</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://ydqqxvtfvnhxpydccciu.supabase.co';
const SUPABASE_KEY='sb_publishable_A-x4W6e_ES8k7fQR3TgGhw_DeVLH50O';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const frame=document.getElementById('app'), login=document.getElementById('login'), statusEl=document.getElementById('status'), syncEl=document.getElementById('sync');
let user=null, applyingRemote=false, lastHash='', channel=null, timer=null;
function status(msg,cls=''){statusEl.className=cls;statusEl.textContent=msg}
function frameStorage(){try{return frame.contentWindow.localStorage}catch(e){return null}}
function snapshot(){const s=frameStorage();if(!s)return {};const o={};for(let i=0;i<s.length;i++){const k=s.key(i);if(k!=null)o[k]=s.getItem(k)}return o}
function hash(o){return JSON.stringify(o)}
function putSnapshot(o){const s=frameStorage();if(!s)return;applyingRemote=true;try{for(let i=s.length-1;i>=0;i--){const k=s.key(i);if(k!==null)s.removeItem(k)}for(const [k,v] of Object.entries(o||{})){s.setItem(k,v)}}finally{applyingRemote=false}}
async function loadRemote(){if(!user)return;const {data,error}=await db.from('rhpro_sync').select('data,updated_at').eq('user_id',user.id).maybeSingle();if(error){console.error(error);syncEl.textContent='⚠ Falha na leitura';return}if(data&&data.data&&Object.keys(data.data).length){putSnapshot(data.data);lastHash=hash(data.data);frame.contentWindow.location.reload();syncEl.textContent='☁ Dados recuperados'}else{await saveRemote(true)}}
async function saveRemote(force=false){if(!user||applyingRemote)return;const snap=snapshot(),h=hash(snap);if(!force&&h===lastHash)return;const {error}=await db.from('rhpro_sync').upsert({user_id:user.id,data:snap,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error){console.error(error);syncEl.textContent='⚠ Erro na sincronização';return}lastHash=h;syncEl.textContent='☁ Sincronizado'}
async function startSync(){if(!user)return;login.style.display='none';syncEl.style.display='block';await new Promise(r=>setTimeout(r,700));await loadRemote();if(timer)clearInterval(timer);timer=setInterval(()=>saveRemote(false),2000);if(channel)await db.removeChannel(channel);channel=db.channel('rhpro-sync-'+user.id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'rhpro_sync',filter:'user_id=eq.'+user.id},payload=>{if(payload.new&&payload.new.data&&!applyingRemote){const remote=payload.new.data,h=hash(remote);if(h!==lastHash){putSnapshot(remote);lastHash=h;syncEl.textContent='☁ Atualização recebida';setTimeout(()=>frame.contentWindow.location.reload(),100)}}}).subscribe()}
async function authExisting(){const {data:{session}}=await db.auth.getSession();if(session){user=session.user;startSync()}}
document.getElementById('enter').onclick=async()=>{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password){status('Informe e-mail e senha.','err');return}status('Entrando...');const {data,error}=await db.auth.signInWithPassword({email,password});if(error){status('Não foi possível entrar: '+error.message,'err');return}user=data.user;status('Acesso autorizado.','ok');startSync()};
document.getElementById('signup').onclick=async()=>{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||password.length<6){status('Informe um e-mail e uma senha com pelo menos 6 caracteres.','err');return}status('Criando seu acesso...');const {data,error}=await db.auth.signUp({email,password});if(error){status('Não foi possível criar o acesso: '+error.message,'err');return}if(data.session){user=data.user;status('Acesso criado.','ok');startSync()}else{status('Acesso criado. Verifique seu e-mail para confirmar a conta e depois entre.','ok')}};
db.auth.onAuthStateChange((event,session)=>{if(session&&!user){user=session.user;startSync()}});
frame.addEventListener('load',()=>{if(user&&!lastHash){setTimeout(()=>saveRemote(true),1000)}});
authExisting();
</script>
</body>
</html>
