*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#1f2937}
.app{display:flex;min-height:100vh} aside{width:245px;background:#123b67;color:#fff;position:fixed;left:0;top:0;bottom:0;padding:20px 14px;overflow:auto}
.brand{font-size:22px;font-weight:800;padding:8px 10px 20px}.brand span{display:block;font-size:11px;font-weight:400;opacity:.75;margin-top:5px}
.nav{width:100%;display:block;text-align:left;border:0;background:transparent;color:#eaf2fa;padding:11px 12px;border-radius:8px;margin:2px 0;cursor:pointer;font-size:14px}
.nav:hover,.nav.active{background:#1f5a91} main{margin-left:245px;width:calc(100% - 245px);padding:28px}

.cards{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:14px;margin-bottom:20px}.card,.panel{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 10px #0000000d}.n{font-size:28px;font-weight:800;margin-top:8px}

input,select{width:100%;padding:9px 10px;border:1px solid #d4dae1;border-radius:7px;font:inherit;background:#fff}.search{max-width:350px}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1000px}th,td{border:1px solid #cfd6de;padding:11px 10px;text-align:left;font-size:13px;vertical-align:middle;line-height:1.35}th{background:#eef2f6;white-space:nowrap}tbody tr:nth-child(even) td{background:#fafbfc}tbody tr:hover td{background:#edf5fc}
.grid{display:grid;grid-template-columns:repeat(3,minmax(180px,1fr));gap:12px}label{font-size:12px;font-weight:700;color:#4b5563}label input,label select{margin-top:5px}.empty{padding:30px;text-align:center;color:#7b8490}.mini{border:0;background:#eef2f6;border-radius:6px;padding:6px 8px;cursor:pointer;margin:2px}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef2f6;font-size:12px}
@media(max-width:900px){aside{width:195px}main{margin-left:195px;width:calc(100% - 195px);padding:18px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style>

function save(){localStorage.setItem('rhpro_data',JSON.stringify(data))}function rows(name){data[name]=data[name]||[];return data[name]}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function showSection(name){current=name;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.textContent===name));if(name==='Dashboard'){let n=rows('Colaboradores').length,a=rows('Tarefas RH').length,f=rows('Férias').length;document.getElementById('main').innerHTML=`<div class="top"><div><h1>Dashboard</h1><div class="muted">Visão geral do seu RH</div></div></div><div class="cards"><div class="card"><div>Total de funcionários</div><div class="n">${n}</div></div><div class="card"><div>Aniversariantes do mês</div><div class="n">${rows('Colaboradores').filter(r=>r[6]).length}</div></div><div class="card"><div>Férias cadastradas</div><div class="n">${f}</div></div><div class="card"><div>Tarefas pendentes</div><div class="n">${a}</div></div></div><div class="panel"><h2>Bem-vinda ao Sistema RH PRO</h2><p>Utilize o menu ao lado para cadastrar funcionários, controlar férias, acompanhar documentos, organizar tarefas e manter as informações do RH.</p></div>`;return}document.getElementById('main').innerHTML=`<div class="top"><div><h1>${esc(name)}</h1><div class="muted">Cadastros e controles do RH</div></div></div><div class="panel"><div class="actions"><button class="primary" onclick="addRow('${esc(name)}')">+ Novo cadastro</button><input class="search" id="search" placeholder="Pesquisar..." oninput="renderRows('${esc(name)}')"><button class="secondary" onclick="exportCSV('${esc(name)}')">Exportar CSV</button></div><div id="tableArea" class="table-wrap"></div></div>`;renderRows(name)}
function renderRows(name){const cols=sections[name],q=(document.getElementById('search')?.value||'').toLowerCase(),rs=rows(name).filter(r=>r.join(' ').toLowerCase().includes(q));if(!rs.length){document.getElementById('tableArea').innerHTML='<div class="empty">Nenhum registro. Clique em “+ Novo cadastro” para começar.</div>';return}let t='<table><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'<th>Ações</th></tr></thead><tbody>';rs.forEach((r,i)=>{const real=rows(name).indexOf(r);t+='<tr>'+cols.map((c,j)=>'<td>'+esc(r[j]||'')+'</td>').join('')+'<td><button class="mini" onclick="editRow(\''+name+'\','+real+')">Editar</button> <button class="mini" onclick="delRow(\''+name+'\','+real+')">Excluir</button></td></tr>'});t+='</tbody></table>';document.getElementById('tableArea').innerHTML=t}
function addRow(name){editForm(name,-1)}function editRow(name,i){editForm(name,i)}function editForm(name,index){const cols=sections[name],r=index>=0?rows(name)[index]:Array(cols.length).fill('');const fields=cols.map((c,j)=>`<label>${esc(c)}<input id="f${j}" value="${esc(r[j]||'')}" /></label>`).join('');document.getElementById('main').innerHTML=`<div class="top"><div><h1>${index<0?'Novo':'Editar'}: ${esc(name)}</h1></div></div><div class="panel"><div class="grid">${fields}</div><div class="actions" style="margin-top:18px"><button class="primary" onclick="saveRow('${esc(name)}',${index})">Salvar</button><button class="secondary" onclick="showSection('${esc(name)}')">Cancelar</button></div></div>`}
function saveRow(name,index){const cols=sections[name],r=cols.map((_,j)=>document.getElementById('f'+j).value);if(index<0)rows(name).push(r);else rows(name)[index]=r;save();showSection(name)}function delRow(name,i){if(confirm('Excluir este registro?')){rows(name).splice(i,1);save();renderRows(name)}}function exportCSV(name){const cols=sections[name],rs=rows(name),csv=[cols,...rs].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download=name.replace(/\s+/g,'_')+'.csv';a.click()}showSection('Dashboard');
