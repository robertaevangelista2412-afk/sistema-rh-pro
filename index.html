<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sistema RH PRO</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#1f2937}
.app{display:flex;min-height:100vh} aside{width:245px;background:#123b67;color:#fff;position:fixed;left:0;top:0;bottom:0;padding:20px 14px;overflow:auto}
.brand{font-size:22px;font-weight:800;padding:8px 10px 20px}.brand small{display:block;font-size:11px;font-weight:400;opacity:.75;margin-top:5px}
.nav{width:100%;display:block;text-align:left;border:0;background:transparent;color:#eaf2fa;padding:11px 12px;border-radius:8px;margin:2px 0;cursor:pointer;font-size:14px}.nav:hover,.nav.active{background:#1f5a91}
main{margin-left:245px;width:calc(100% - 245px);padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}h1{margin:0;font-size:27px}h2{margin-top:0}.muted{color:#6b7280;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:14px;margin-bottom:20px}.card,.panel{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 10px #0000000d}.n{font-size:28px;font-weight:800;margin-top:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}button.primary{background:#123b67;color:#fff;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}button.secondary{background:#e9eef4;color:#123b67;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
input,select{width:100%;padding:9px 10px;border:1px solid #d4dae1;border-radius:7px;font:inherit;background:#fff}.search{max-width:350px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1000px}th,td{border:1px solid #cfd6de;padding:11px 10px;text-align:left;font-size:13px;vertical-align:middle;line-height:1.35}th{background:#eef2f6;white-space:nowrap}tbody tr:nth-child(even) td{background:#fafbfc}tbody tr:hover td{background:#edf5fc}
.grid{display:grid;grid-template-columns:repeat(3,minmax(180px,1fr));gap:12px}label{font-size:12px;font-weight:700;color:#4b5563}label input,label select{margin-top:5px}.empty{padding:30px;text-align:center;color:#7b8490}.mini{border:0;background:#eef2f6;border-radius:6px;padding:6px 8px;cursor:pointer;margin:2px}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef2f6;font-size:12px}
@media(max-width:900px){aside{width:195px}main{margin-left:195px;width:calc(100% - 195px);padding:18px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
.dashboard-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.dashboard-tools .search{max-width:520px;flex:1 1 320px}.quick-results{margin-top:12px}.quick-results table{min-width:700px}.quick-empty{padding:18px;text-align:center;color:#6b7280}.backup-note{font-size:12px;color:#6b7280;margin-top:8px}
#feriasAnexoModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;align-items:center;justify-content:center}#feriasAnexoModal.show{display:flex}.ferias-modal-box{background:#fff;width:min(650px,92vw);border-radius:14px;padding:24px;box-shadow:0 12px 40px rgba(0,0,0,.25)}.ferias-modal-close{float:right;border:0;background:#eef2f6;border-radius:8px;padding:7px 10px;cursor:pointer}
.cep-row{display:grid;grid-template-columns:180px 120px 1fr;gap:10px;align-items:end}.cep-btn{height:30px;padding:4px 8px;font-size:11px;white-space:nowrap}.cep-status{font-size:12px;color:#6b7280;margin-top:5px}
#colaboradoresTabelaUnica,#feriasTabelaUnica,#ferDocTabelaUnica,#descontosTabelaUnica,#rtUnifiedTabelaUnica,#trUnifiedTabelaUnica,#documentosTabelaUnica{overflow-x:auto!important}#colaboradoresTabelaUnica table{min-width:2500px!important}#feriasTabelaUnica table{min-width:1450px!important}#ferDocTabelaUnica table{min-width:1200px!important}#descontosTabelaUnica table{min-width:1250px!important}#rtUnifiedTabelaUnica table,#trUnifiedTabelaUnica table,#documentosTabelaUnica table{min-width:1400px!important}#rtUnifiedTabelaUnica table,#trUnifiedTabelaUnica table{width:max-content!important;min-width:1600px!important;table-layout:auto!important}#rtConteudo .table-wrap{overflow-x:auto!important;overflow-y:hidden!important;width:100%!important}#rtConteudo table{border-collapse:collapse!important;width:max-content!important;min-width:1800px!important;table-layout:auto!important}
#colaboradoresTabelaUnica th,#colaboradoresTabelaUnica td,#feriasTabelaUnica th,#feriasTabelaUnica td,#ferDocTabelaUnica th,#ferDocTabelaUnica td,#descontosTabelaUnica th,#descontosTabelaUnica td,#rtUnifiedTabelaUnica th,#rtUnifiedTabelaUnica td,#trUnifiedTabelaUnica th,#trUnifiedTabelaUnica td,#documentosTabelaUnica th,#documentosTabelaUnica td,#rtConteudo table tr,#rtConteudo table th,#rtConteudo table td{white-space:nowrap!important;word-break:keep-all!important;overflow:visible!important;text-overflow:clip!important;line-height:1.2!important;height:42px!important;vertical-align:middle!important}
#colaboradoresTabelaUnica th,#colaboradoresTabelaUnica td{word-break:keep-all!important}#colaboradoresTabelaUnica th:nth-child(2),#colaboradoresTabelaUnica td:nth-child(2),#feriasTabelaUnica th:nth-child(2),#feriasTabelaUnica td:nth-child(2),#ferDocTabelaUnica th:first-child,#ferDocTabelaUnica td:first-child,#descontosTabelaUnica th:nth-child(2),#descontosTabelaUnica td:nth-child(2),#rtUnifiedTabelaUnica th:first-child,#rtUnifiedTabelaUnica td:first-child,#trUnifiedTabelaUnica th:first-child,#trUnifiedTabelaUnica td:first-child,#documentosTabelaUnica th:nth-child(2),#documentosTabelaUnica td:nth-child(2),#rtConteudo table th:first-child,#rtConteudo table td:first-child{min-width:360px!important}
.rt-tab,.dp-tab,.seg-tab,.ferias-tab{background:#e9eef4!important;color:#123b67!important;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600}.rt-tab.active,.dp-tab.active,.seg-tab.active,.ferias-tab.active{background:#123b67!important;color:#fff!important}
.nav,.nav:hover,.nav.active{border:0!important;outline:none!important;box-shadow:none!important}.nav.active{background:#123b67!important;color:#fff!important}.nav:not(.active){background:transparent!important;color:#eaf2fa!important}.nav:not(.active):hover{background:#1f5a91!important;color:#fff!important}
.training-pdf-area{margin-top:14px;padding:14px 0 4px}.training-pdf-area .pdf-title{font-weight:700;font-size:14px;margin-bottom:8px}.training-pdf-area .pdf-picker{display:flex;align-items:center;gap:10px;border:1px solid #cfd6de;border-radius:8px;padding:10px}.training-panel{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 10px #0000000d}
</style>
</head>
<body>
<div id="app" class="app"><aside><div class="brand">SISTEMA RH PRO<small>Gestão de Recursos Humanos</small></div><div id="nav"></div></aside><main><div id="content"></div></main></div>
<div id="feriasAnexoModal"></div>
<script>
const INITIAL={"Colaboradores":[["1","COLABORADOR 1","","","","","","","","","","Ativo"],["2","COLABORADOR 2","","","","","","","","","","Ativo"]],"Férias":[],"Documentos":[],"Descontos":[],"Documentos Férias":[],"Segurança do Trabalho e Medicina":[],"Departamento Pessoal":[],"Tarefas RH":[],"Agenda RH":[],"Relatórios e Treinamentos":[],"Configurações":[]};
let data=JSON.parse(localStorage.getItem('RH_PRO_DATA')||'null')||INITIAL;
if(!data['Relatórios Unificados']) data['Relatórios Unificados']=[]; if(!data['Treinamentos Unificados']) data['Treinamentos Unificados']=[]; if(!data['Treinamentos Documentos']) data['Treinamentos Documentos']=[]; if(!data['DP Documentos']) data['DP Documentos']=[]; if(data['Segurança do Trabalho']&&!data['Segurança do Trabalho e Medicina']){data['Segurança do Trabalho e Medicina']=data['Segurança do Trabalho'];delete data['Segurança do Trabalho'];} if(!data['Documentos Férias']) data['Documentos Férias']=[]; if(data['Saúde Ocupacional']&&!data['Descontos']){data['Descontos']=data['Saúde Ocupacional'];delete data['Saúde Ocupacional'];}
localStorage.setItem('RH_PRO_DATA',JSON.stringify(data));
const MODULES=['Colaboradores','Férias','Documentos','Descontos','Segurança do Trabalho e Medicina','Departamento Pessoal','Tarefas RH','Agenda RH','Relatórios e Treinamentos','Configurações'];
const nav=document.getElementById('nav');
function save(){localStorage.setItem('RH_PRO_DATA',JSON.stringify(data));}
function showSection(name){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.textContent===name));document.getElementById('content').innerHTML='<section><div class="top"><div><h1>'+name+'</h1><div class="muted">Sistema RH PRO</div></div></div><div class="panel"><h2>'+name+'</h2><div class="empty">Dados recuperados do backup. Esta versão foi publicada a partir do arquivo recuperado.</div></div></section>';}
MODULES.forEach(name=>{const b=document.createElement('button');b.className='nav';b.textContent=name;b.onclick=()=>showSection(name);nav.appendChild(b);});
const db=document.createElement('button');db.className='nav';db.textContent='Dashboard';db.onclick=()=>showSection('Dashboard');nav.prepend(db);showSection('Dashboard');
</script>
</body></html>
