<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#1f2937}
.app{display:flex;min-height:100vh} aside{width:245px;background:#123b67;color:#fff;position:fixed;left:0;top:0;bottom:0;padding:20px 14px;overflow:auto}
.brand{font-size:22px;font-weight:800;padding:8px 10px 20px} .brand small{display:block;font-size:11px;font-weight:400;opacity:.75;margin-top:5px}
.nav{width:100%;display:block;text-align:left;border:0;background:transparent;color:#eaf2fa;padding:11px 12px;border-radius:8px;margin:2px 0;cursor:pointer;font-size:14px}
.nav:hover,.nav.active{background:#1f5a91} main{margin-left:245px;width:calc(100% - 245px);padding:28px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px} h1{margin:0;font-size:27px} h2{margin-top:0} .muted{color:#6b7280;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:14px;margin-bottom:20px}
.card,.panel{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 10px #0000000d} .n{font-size:28px;font-weight:800;margin-top:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px} button.primary{background:#123b67;color:#fff;border:0;border-radius:8px;padding:10px 14px;cursor:pointer} button.secondary{background:#e9eef4;color:#123b67;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
input,select{width:100%;padding:9px 10px;border:1px solid #d4dae1;border-radius:7px;font:inherit;background:#fff} .search{max-width:350px}
.table-wrap{overflow:auto} table{width:100%;border-collapse:collapse;min-width:1000px} th,td{border:1px solid #cfd6de;padding:11px 10px;text-align:left;font-size:13px;vertical-align:middle;line-height:1.35} th{background:#eef2f6;white-space:nowrap} tbody tr:nth-child(even) td{background:#fafbfc} tbody tr:hover td{background:#edf5fc}
.grid{display:grid;grid-template-columns:repeat(3,minmax(180px,1fr));gap:12px} label{font-size:12px;font-weight:700;color:#4b5563} label input,label select{margin-top:5px}
.empty{padding:30px;text-align:center;color:#7b8490} .mini{border:0;background:#eef2f6;border-radius:6px;padding:6px 8px;cursor:pointer;margin:2px}
.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef2f6;font-size:12px}
@media(max-width:900px){aside{width:195px}main{margin-left:195px;width:calc(100% - 195px);padding:18px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}

function birthdayRows(){
 const month=new Date().getMonth()+1;
 const map={JANEIRO:1,FEVEREIRO:2,'MARÇO':3,MARCO:3,ABRIL:4,MAIO:5,JUNHO:6,JULHO:7,AGOSTO:8,SETEMBRO:9,OUTUBRO:10,NOVEMBRO:11,DEZEMBRO:12};

 function parseBirthday(value){
   const raw=String(value||'').trim();
   if(!raw)return null;
   const up=raw.toUpperCase();

   // Ex.: 17 DE OUTUBRO DE 1972
   let m=up.match(/^(\d{1,2})\s+DE\s+([A-ZÇÃÕ]+)\s+DE\s+(\d{2,4})$/);
   if(m && map[m[2]])return {day:Number(m[1]),month:map[m[2]]};

   // Ex.: 17/10/1972, 17-10-1972 ou 17.10.1972
   m=up.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
   if(m)return {day:Number(m[1]),month:Number(m[2])};

   // Ex.: 1972-10-17
   m=up.match(/^\d{4}-(\d{1,2})-(\d{1,2})$/);
   if(m)return {day:Number(m[2]),month:Number(m[1])};

   return null;
 }

 return rows('Colaboradores')
   .map((r,index)=>({r,index,birthday:parseBirthday(r[6])}))
   .filter(x=>x.birthday && x.birthday.month===month)
   .sort((a,b)=>a.birthday.day-b.birthday.day || String(a.r[1]||'').localeCompare(String(b.r[1]||''),'pt-BR'))
   .map(x=>x.r);
}


async function attachVacationDocument(vacIndex){
 const input=document.getElementById('vacFile_'+vacIndex);
 const file=input?.files?.[0];
 if(!file){alert('Selecione um PDF ou uma foto para anexar.');return;}
 const allowed=['application/pdf','image/jpeg','image/png'];
 if(!allowed.includes(file.type)){alert('Use PDF, JPG ou PNG.');return;}
 const vac=rows('Férias')[vacIndex];
 const employee=vac?.[1]||'';
 try{
   const db=await openDocDB();
   const id='ferias_'+Date.now()+'_'+Math.random().toString(36).slice(2);
   await new Promise((resolve,reject)=>{
     const tx=db.transaction('files','readwrite');
     tx.objectStore('files').put({id,blob:file});
     tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error);
   });
   vac[11]=id;
   vac[12]=file.name;
   save();
   renderTable('Férias');
   alert('Documento de férias anexado para '+employee+'.');
 }catch(e){alert('Não foi possível salvar o arquivo neste navegador.');}
}

 const url=URL.createObjectURL(blob);
 window.open(url,'_blank');
 setTimeout(()=>URL.revokeObjectURL(url),60000);
}

function exportRHProBackup(){

   const payload={version:1,exportadoEm:new Date().toISOString(),data:data};
   const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
   const a=document.createElement('a');
   a.href=URL.createObjectURL(blob);
   a.download='RH_PRO_BACKUP_'+new Date().toISOString().slice(0,10)+'.json';
   document.body.appendChild(a);a.click();a.remove();
   setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 }catch(e){alert('Não foi possível gerar o backup.');}
}
function importRHProBackup(){
 const input=document.createElement('input');
 input.type='file';input.accept='application/json,.json';
 input.onchange=()=>{
   const file=input.files?.[0]; if(!file)return;
   const reader=new FileReader();
   reader.onload=()=>{
     try{
       const payload=JSON.parse(reader.result);
       const imported=payload?.data||payload;
       if(!imported || !Array.isArray(imported['Colaboradores'])) throw new Error('Arquivo inválido');
       if(!confirm('Restaurar este backup? Os dados atuais deste navegador serão substituídos pelos dados do arquivo.')) return;
       data=imported;
       if(!data['Documentos RH DP']) data['Documentos RH DP']=[];
       if(!data['Relatórios Unificados']) data['Relatórios Unificados']=[];
       if(!data['Treinamentos Unificados']) data['Treinamentos Unificados']=[];
       if(!data['Treinamentos Documentos']) data['Treinamentos Documentos']=[];
       if(!data['DP Documentos']) data['DP Documentos']=[];
       if(!data['Documentos Férias']) data['Documentos Férias']=[];
       data['Colaboradores'].forEach(r=>{while(r.length<31)r.push('');});
       save();
       alert('Backup restaurado com sucesso.');
       showSection('Dashboard');
     }catch(e){alert('Esse arquivo não é um backup válido do RH PRO.');}
   };
   reader.readAsText(file);
 };
 input.click();
}

function openDocDB(){
 return new Promise((resolve,reject)=>{
   const req=indexedDB.open('RH_PRO_DOCUMENTOS');
   req.onupgradeneeded=()=>{
     if(!req.result.objectStoreNames.contains('files')) req.result.createObjectStore('files',{keyPath:'id'});
   };
   req.onsuccess=()=>resolve(req.result);
   req.onerror=()=>reject(req.error||new Error('Não foi possível abrir o banco de documentos.'));
   req.onblocked=()=>reject(new Error('O banco de documentos está bloqueado por outra janela do RH PRO.'));
 });
}

async function salvarArquivoNoBanco(dbPromise,id,file,metadata){
 const db=await dbPromise;
 try{
   if(!db.objectStoreNames.contains('files')){
     throw new Error('O armazenamento de arquivos não está disponível.');
   }
   await new Promise((resolve,reject)=>{
     const tx=db.transaction('files','readwrite');
     tx.objectStore('files').put(Object.assign({id:id,blob:file},metadata||{}));
     tx.oncomplete=resolve;
     tx.onerror=()=>reject(tx.error||new Error('Falha ao salvar o arquivo.'));
     tx.onabort=()=>reject(tx.error||new Error('Operação de salvamento cancelada.'));
   });
 }finally{
   try{db.close();}catch(e){}
 }
}

function addSelectedDocumentFiles(input){
 const selected=Array.from(input.files||[]);
 const msg=document.getElementById('docMsg');
 if(!selected.length)return;
 const existing=new Set(__DOC_PENDING_FILES.map(f=>f.name+'|'+f.size+'|'+f.lastModified));
 selected.forEach(file=>{
   const key=file.name+'|'+file.size+'|'+file.lastModified;
   if(!existing.has(key)){__DOC_PENDING_FILES.push(file);existing.add(key);}
 });
 // Mantém o nome visível no primeiro campo para confirmar que o arquivo foi escolhido.
 if(input.id==='docFileExtra') input.value='';
 renderSelectedDocumentFiles();
 if(msg)msg.textContent=__DOC_PENDING_FILES.length+' arquivo(s) selecionado(s).';
}

async function attachDocument(){
 const employee=document.getElementById('docEmployee').value;
 const type=document.getElementById('docType').value;
 const note=document.getElementById('docNote').value;
 const input=document.getElementById('docFile');
 const extra=document.getElementById('docFileExtra');
 const rawFiles=[...Array.from(input.files||[]),...Array.from(extra?.files||[])];
 const files=__DOC_PENDING_FILES.length?__DOC_PENDING_FILES.slice():rawFiles;
 const msg=document.getElementById('docMsg');
 if(!employee || !files.length){msg.textContent='Selecione o colaborador e pelo menos um arquivo.';return;}
 const allowedExt=/\.(pdf|jpe?g|png)$/i;
 if(files.some(file=>!allowedExt.test(file.name||''))){msg.textContent='Formato não permitido. Use apenas PDF, JPG, JPEG ou PNG.';return;}
 try{
   if(__DOC_EDIT_INDEX>=0){
     const r=rows('Documentos')[__DOC_EDIT_INDEX];
     if(!r){__DOC_EDIT_INDEX=-1;msg.textContent='Documento não encontrado.';return;}
     r[1]=employee;r[2]=type;r[7]=note;
     if(files.length){
       const file=files[0];
       const db=await openDocDB();
       try{
         await new Promise((resolve,reject)=>{
           const tx=db.transaction('files','readwrite');
           const store=tx.objectStore('files');
           const req=store.get(r[0]);
           req.onsuccess=()=>{const old=req.result||{id:r[0]};old.blob=file;old.area='Documentos';old.funcionario=employee;old.tipo=type;old.nome=file.name;store.put(old);};
           req.onerror=()=>reject(req.error||new Error('Arquivo não encontrado.'));
           tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('Falha ao salvar.'));
         });
       }finally{try{db.close();}catch(e){}}
       r[6]=file.name;
     }
     save();
     __DOC_EDIT_INDEX=-1;
     __DOC_PENDING_FILES=[];
     renderDocuments();
     return;
   }

   const novos=[];
   for(const file of files){
     const id='doc_'+Date.now()+'_'+Math.random().toString(36).slice(2);
     await salvarArquivoNoBanco(openDocDB(),id,file,{area:'Documentos',funcionario:employee,tipo:type,nome:file.name});
     novos.push([id,employee,type,new Date().toLocaleDateString('pt-BR'),'', 'Anexado', file.name, note]);
   }
   rows('Documentos').push(...novos);
   __DOC_PENDING_FILES=[];
   save();
   renderDocuments();
   const done=document.getElementById('docMsg');
   if(done)done.textContent=novos.length+' documento(s) anexado(s) com sucesso.';
 }catch(e){console.error(e);msg.textContent='Não foi possível salvar o(s) arquivo(s): '+(e.message||'verifique o navegador.');}
}

async function getDocFile(id){
 const db=await openDocDB();
 try{
   return await new Promise((resolve,reject)=>{
     const tx=db.transaction('files','readonly'), req=tx.objectStore('files').get(id);
     req.onsuccess=()=>resolve(req.result?.blob||null); req.onerror=()=>reject(req.error);
   });
 }finally{try{db.close();}catch(e){}}
}
async function viewDocument(id){
 const blob=await getDocFile(id);
 if(!blob){alert('Arquivo não encontrado.');return;}
 const url=URL.createObjectURL(blob); window.open(url,'_blank');
 setTimeout(()=>URL.revokeObjectURL(url),60000);
}
async function deleteDocument(i){
 const r=rows('Documentos')[i];
 if(!confirm('Excluir este documento e o arquivo anexado?')) return;
 try{
   const db=await openDocDB();
   await new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').delete(r[0]);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});
 }catch(e){}
 rows('Documentos').splice(i,1); save(); renderDocuments();
}

function mesDaCompetencia(v){
 const txt=String(v||'').toLowerCase();
 const nomes=['janeiro','fevereiro','marco','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
 for(let i=0;i<nomes.length;i++){
   if(txt.indexOf(nomes[i])>=0 || (nomes[i]==='marco' && txt.indexOf('março')>=0)) return i+1;
 }
 const nums=txt.match(/\d{1,2}/g)||[];
 if(nums.length){
   const n=Number(nums[0]);
   if(n>=1&&n<=12)return n;
 }
 return 0;
}

  const id='dp_'+Date.now()+'_'+Math.random().toString(36).slice(2);

async function excluirArquivoDP(index){

}

function abrirBancoTreinamentos(){
 return new Promise((resolve,reject)=>{
   const req=indexedDB.open('RH_PRO_TREINAMENTOS');
   req.onupgradeneeded=()=>{
     if(!req.result.objectStoreNames.contains('files')){
       req.result.createObjectStore('files',{keyPath:'id'});
     }
   };
   req.onsuccess=()=>resolve(req.result);
   req.onerror=()=>reject(req.error||new Error('Não foi possível abrir o armazenamento de treinamentos.'));
   req.onblocked=()=>reject(new Error('O armazenamento de treinamentos está bloqueado por outra janela do RH PRO.'));
 });
}

async function abrirArquivoSistema(id, sourceKey){
 try{
   const db=sourceKey==='Treinamentos Unificados' ? await abrirBancoTreinamentos() : await abrirBancoArquivos();
   const blob=await new Promise((resolve,reject)=>{
     const tx=db.transaction('files','readonly');
     const req=tx.objectStore('files').get(id);
     req.onsuccess=()=>resolve(req.result?.blob||null);
     req.onerror=()=>reject(req.error);
   });
   db.close();
   if(!blob){alert('Arquivo não encontrado.');return;}
   const url=URL.createObjectURL(blob);
   window.open(url,'_blank');
   setTimeout(()=>URL.revokeObjectURL(url),60000);
 }catch(e){
   console.error(e);
   alert('Não foi possível abrir o PDF.');
 }
}

async function excluirArquivoSistema(key,index){
 const list=data[key]||[];
 const item=list[index];
 if(!item)return;
 if(!confirm('Excluir este registro e o PDF anexado?'))return;

 try{
   const db=key==='Treinamentos Unificados' ? await abrirBancoTreinamentos() : await abrirBancoArquivos();
   await new Promise((resolve,reject)=>{
     const tx=db.transaction('files','readwrite');
     tx.objectStore('files').delete(item[item.length-1]);
     tx.oncomplete=resolve;
     tx.onerror=()=>reject(tx.error);
   });
   db.close();
 }catch(e){
   console.error(e);
 }

 list.splice(index,1);
 save();
 key==='Relatórios Unificados' ? renderRelatoriosUnificados() : renderTreinamentosUnificados();
}

 if(!rs.length) h+='<tr><td colspan="7" class="empty">Nenhum documento cadastrado.</td></tr>';
 rs.forEach(r=>{const i=docs.indexOf(r);h+=`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(formatarDataBR_RHDP(r[2]))}</td><td>${esc(formatarDataBR_RHDP(r[3]))}</td><td>${esc(r[4])}</td><td>${esc(r[6])}</td><td><button class="mini" onclick="abrirDocumentoRHDp('${esc(r[8])}')">👁️ Abrir</button><button class="mini" onclick="excluirDocumentoRHDp(${i})">🗑️ Excluir</button></td></tr>`});
 document.getElementById('rhdpTabela').innerHTML='<div id="rhdpTabelaUnicaReal">'+h+'</tbody></table></div>';
}
async function abrirDocumentoRHDp(id){const blob=await getDocFile(id);if(!blob){alert('Arquivo não encontrado.');return;}const url=URL.createObjectURL(blob);window.open(url,'_blank');setTimeout(()=>URL.revokeObjectURL(url),120000);}
async function excluirDocumentoRHDp(i){const docs=data['Documentos RH DP']||[],doc=docs[i];if(!doc)return;if(!confirm('Excluir este documento?'))return;try{const db=await openDocDB();await new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').delete(doc[8]);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});db.close();}catch(e){}docs.splice(i,1);save();renderListaDocumentosRHDp();}

function limparCampoArquivo(id){
 const old=document.getElementById(id);
 if(!old) return;
 const novo=old.cloneNode(true);
 novo.value='';
 old.parentNode.replaceChild(novo,old);
}

function campoEhData(campo){
 const c=String(campo||'').toLowerCase().trim();
 return c==='data' ||
        c==='prazo' ||
        c==='validade' ||
        c==='data de emissão' ||
        c==='data de admissão' ||
        c==='data de nascimento' ||
        c==='data início' ||
        c==='data fim' ||
        c==='período aquisitivo início' ||
        c==='período aquisitivo fim' ||
        c==='período inicial' ||
        c==='período final';
}
function dataParaInput(v){
 if(!v) return '';
 const s=String(v).trim();
 let m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
 if(m) return `${m[3]}-${m[2]}-${m[1]}`;
 m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
 if(m) return s;
 const meses={janeiro:'01',fevereiro:'02','março':'03',abril:'04',maio:'05',junho:'06',julho:'07',agosto:'08',setembro:'09',outubro:'10',novembro:'11',dezembro:'12'};
 m=s.toLowerCase().match(/^(\d{1,2})\s+de\s+([a-zçãõ]+)\s+de\s+(\d{4})$/);
 if(m && meses[m[2]]) return `${m[3]}-${meses[m[2]]}-${String(m[1]).padStart(2,'0')}`;
 return '';
}
function dataParaSalvar(v){
 if(!v) return '';
 const m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})$/);
 if(m) return `${m[3]}/${m[2]}/${m[1]}`;
 return String(v);
}
function dataParaExibir(v){
 if(!v) return '';
 const s=String(v).trim();
 let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
 if(m) return `${String(m[3]).padStart(2,'0')}/${String(m[2]).padStart(2,'0')}/${m[1]}`;
 const meses={janeiro:'01',fevereiro:'02','março':'03',marco:'03',abril:'04',maio:'05',junho:'06',julho:'07',agosto:'08',setembro:'09',outubro:'10',novembro:'11',dezembro:'12'};
 m=s.toLowerCase().match(/^(\d{1,2})\s+de\s+([a-zçãõ]+)\s+de\s+(\d{4})$/);
 if(m && meses[m[2]]) return `${String(m[1]).padStart(2,'0')}/${meses[m[2]]}/${m[3]}`;
 m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
 if(m){
   const year=m[3].length===2?'20'+m[3]:m[3];
   return `${String(m[1]).padStart(2,'0')}/${String(m[2]).padStart(2,'0')}/${year}`;
 }
 return s;
}

function editForm(name,index){
 const cols=MODULES[name], r=index<0?Array(cols.length).fill(''):rows(name)[index];
 if(name!=='Colaboradores'){
   const statusOpts = name==='Tarefas RH'
     ? ['Pendente','Agendado','Em andamento','Concluído','Cancelado']
     : name==='Agenda RH'
       ? ['Agendado','Confirmado','Em andamento','Concluído','Cancelado']
       : null;
   const fields=cols.map((c,j)=>{
     if(statusOpts && c==='Status'){
       const current=r[j]||'';
       const opts=statusOpts.map(o=>`<option value="${esc(o)}" ${current===o?'selected':''}>${esc(o)}</option>`).join('');
       return `<label>${esc(c)}<select id="f${j}"><option value="">Selecione</option>${opts}</select></label>`;
     }
     if(campoEhData(c)){
       return `<label>${esc(c)}<input id="f${j}" type="date" value="${esc(dataParaInput(r[j]||''))}" /></label>`;
     }
     return `<label>${esc(c)}<input id="f${j}" value="${esc(r[j]||'')}" /></label>`;
   }).join('');
   document.getElementById('main').innerHTML=`<div class="top"><div><h1>${index<0?'Novo':'Editar'} — ${esc(name)}</h1></div></div><div class="panel"><div class="grid">${fields}</div><div class="actions" style="margin-top:18px"><button class="primary" onclick="saveRow('${esc(name)}',${index})">Salvar</button><button class="secondary" onclick="showSection('${esc(name)}')">Cancelar</button></div></div>`;
   return;
 }
 const labels=cols;
 document.getElementById('main').innerHTML=`
 <div class="top"><div><h1>${index<0?'Novo':'Editar'} — Colaborador</h1><div class="muted">Digite o CEP para preencher automaticamente endereço, bairro, cidade e estado. Informe também número e complemento.</div></div></div>
 <div class="panel">
   <div class="grid">
     ${labels.map((c,j)=>{
       if(c==='Bairro') return '';
       if(c==='Endereço') return `<label style="grid-column:span 2">Endereço<input id="f12" value="${esc(r[12]||'')}"></label>`;
       if(j===15) return '';
       if(campoEhData(c)){
         return `<label>${esc(c)}<input id="f${j}" type="date" value="${esc(dataParaInput(r[j]||''))}"></label>`;
       }
       return `<label>${esc(c)}<input id="f${j}" value="${esc(r[j]||'')}" ${c==='CNPJ da empresa'?'placeholder="00.000.000/0000-00" maxlength="18" oninput="maskCnpj(this)"':''}></label>`;
     }).join('')}
     <div class="cep-bairro-row">
       <label>CEP
         <div class="cep-row"><input id="f15" value="${esc(r[15]||'')}" placeholder="00000-000" maxlength="9" oninput="maskCep(this)"><button type="button" class="primary cep-btn" onclick="buscarCep()">Buscar CEP</button></div>
       </label>
       <label>Bairro<input id="f30" value="${esc(r[30]||'')}" placeholder="Bairro"></label>
     </div>
     <div id="cepStatus" class="cep-status" style="grid-column:span 2"></div>
   </div>
   <div class="actions" style="margin-top:18px">
     <button class="primary" onclick="saveRow('Colaboradores',${index})">Salvar colaborador</button>
     <button class="secondary" onclick="showSection('Colaboradores')">Cancelar</button>
   </div>
 </div>`;
}

function maskCnpj(el){
 let v=el.value.replace(/\D/g,'').slice(0,14);
 if(v.length>12)v=v.slice(0,2)+'.'+v.slice(2,5)+'.'+v.slice(5,8)+'/'+v.slice(8,12)+'-'+v.slice(12);
 else if(v.length>8)v=v.slice(0,2)+'.'+v.slice(2,5)+'.'+v.slice(5,8)+'/'+v.slice(8);
 else if(v.length>5)v=v.slice(0,2)+'.'+v.slice(2,5)+'.'+v.slice(5);
 else if(v.length>2)v=v.slice(0,2)+'.'+v.slice(2);
 el.value=v;
}

function maskCep(el){
 let v=el.value.replace(/\D/g,'').slice(0,8);
 if(v.length>5)v=v.slice(0,5)+'-'+v.slice(5);
 el.value=v;
}
async function buscarCep(){
 const cep=document.getElementById('f15').value.replace(/\D/g,'');
 const status=document.getElementById('cepStatus');
 if(cep.length!==8){status.textContent='Digite um CEP válido com 8 números.';return;}
 status.textContent='Consultando CEP...';
 try{
   const resp=await fetch('https://viacep.com.br/ws/'+cep+'/json/');
   if(!resp.ok) throw new Error();
   const d=await resp.json();
   if(d.erro){status.textContent='CEP não encontrado.';return;}
   // The existing spreadsheet columns are preserved. Address fields are filled
   // wherever their header indicates the matching information.
   const map={
     'Endereço':d.logradouro,'Logradouro':d.logradouro,
     'Bairro':d.bairro,'Cidade':d.localidade,'UF':d.uf,
     'Estado':d.uf
   };
   MODULES['Colaboradores'].forEach((c,j)=>{
     if(map[c]!==undefined && document.getElementById('f'+j)) document.getElementById('f'+j).value=map[c]||'';
   });
   if(document.getElementById('f30')) document.getElementById('f30').value=d.bairro||'';
   status.textContent='Endereço preenchido automaticamente. Confira e complete número/complemento.';
 }catch(e){
   status.textContent='Não foi possível consultar o CEP. Verifique sua conexão e tente novamente.';
 }
}

function saveRow(name,index){
 const cols=MODULES[name];
 const r=cols.map((c,j)=>{
   const v=document.getElementById('f'+j).value;
   return campoEhData(c)?dataParaSalvar(v):v;
 });
 if(index<0) rows(name).push(r); else rows(name)[index]=r;
 if(name==='Colaboradores'){
   rows(name).sort((a,b)=>(a[1]||'').trim().localeCompare((b[1]||'').trim(),'pt-BR',{sensitivity:'base'}));
 }
 save(); showSection(name);
}
function delRow(name,i){if(confirm('Excluir este registro?')){rows(name).splice(i,1);save();showSection(name)}}

repararColaboradores(); save(); showSection('Dashboard');

function iniciarRHPro(){
  try{
    if(typeof repararColaboradores==='function') repararColaboradores();
    if(typeof save==='function') save();
  }catch(e){}
  showSection('Dashboard');
}
window.addEventListener('DOMContentLoaded', iniciarRHPro);
