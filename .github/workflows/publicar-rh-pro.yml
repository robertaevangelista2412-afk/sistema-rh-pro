name: Publicar Sistema RH PRO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preservar a versão final e recuperar dados antigos
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "storedRHProData=JSON.parse(localStorage.getItem('RH_PRO_DATA')||'null')"
          new = "storedRHProData=JSON.parse(localStorage.getItem('RH_PRO_DATA') || localStorage.getItem('rhpro_data') || localStorage.getItem('RHPRO_DATA') || 'null')"
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Corrigir recuperação dos dados do RH PRO"
          git push
