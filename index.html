arefas pendentes<div class="n">${rows('Tarefas RH').length}</div></div></div><div class="panel"><h2>Bem-vinda ao Sistema RH PRO</h2><p>Cadastre funcionários, férias, documentos, saúde ocupacional, segurança, departamento pessoal, tarefas, agenda e relatórios.</p></div>`;return}document.getElementById('main').innerHTML=`<h1>${esc(n)}</h1><div class="panel"><div class="actions"><button class="primary" onclick="editForm('${n}',-1)">+ Novo cadastro</button><input id="search" class="search" placeholder="Pesquisar..." oninput="render('${n}')"><button class="secondary" onclick="csv('${n}')">Exportar CSV</button></div><div id="table" class="table-wrap"></div></div>`;render(n)}function render(n){let q=(document.getElementById('search')?.value||'').toLowerCase(),rs=rows(n).filter(r=>r.join(' ').toLowerCase().includes(q)),cs=sections[n];if(!rs.length){document.getElementById('table').innerHTML='<div class="panel">Nenhum registro. Clique em + Novo cadastro.</div>';return}let t='<table><tr>'+cs.map(c=>`<th>${esc(c)}</th>`).join('')+'<th>Ações</th></tr>';rs.forEach(r=>{let i=rows(n).indexOf(r);t+='<tr>'+cs.map((c,j)=>`<td>${esc(r[j]||'')}</td>`).join('')+`<td><button class="mini" onclick="editForm('${n}',${i})">Editar</button><button class="mini" onclick="delRow('${n}',${i})">Excluir</button></td></tr>`});document.getElementById('table').innerHTML=t+'</table>'}function editForm(n,i){let cs=sections[n],r=i<0?Array(cs.length).fill(''):rows(n)[i];document.getElementById('main').innerHTML=`<h1>${i<0?'Novo':'Editar'}: ${esc(n)}</h1><div class="panel"><div class="grid">${cs.map((c,j)=>`<label>${esc(c)}<input id="f${j}" value="${esc(r[j]||'')}"></label>`).join('')}</div><div class="actions" style="margin-top:18px"><button class="primary" onclick="saveRow('${n}',${i})">Salvar</button><button class="secondary" onclick="showSection('${n}')">Cancelar</button></div></div>`}function saveRow(n,i){let r=sections[n].map((_,j)=>document.getElementById('f'+j).value);if(i<0)rows(n).push(r);else rows(n)[i]=r;save();showSection(n)}function delRow(n,i){if(confirm('Excluir este registro?')){rows(n).splice(i,1);save();render(n)}}function csv(n){let cs=sections[n],out=[cs,...rows(n)].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+out],{type:'text/csv'}));a.download=n+'.csv';a.click()}showSection('Dashboard');</script></body></html>
